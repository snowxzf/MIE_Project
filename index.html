<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line Tracer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #1a1a2e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.35s ease-out;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #3a3a5c;
    margin-bottom: 5px;
  }

  #subtitle {
    font-size: 0.75rem;
    color: #9090b0;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  /* ── Mode buttons ── */
  #mode-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .mode-btn {
    background: #f3f3fa;
    border: 1.5px solid #d0d0e8;
    color: #5050a0;
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .mode-btn:hover { background: #e8e8f8; border-color: #a0a0d8; }
  .mode-btn.active {
    background: #4a36c0;
    border-color: #4a36c0;
    color: #fff;
    box-shadow: 0 2px 10px rgba(74,54,192,0.28);
  }

  #mode-desc {
    font-size: 0.72rem;
    color: #8888b0;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    min-height: 1.1em;
  }

  /* ── Canvas wrapper ── */
  #canvas-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 28px rgba(0,0,0,0.10), 0 0 0 1.5px rgba(0,0,0,0.07);
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  /* ── Mode badge (top-left of canvas) ── */
  #mode-badge {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 5px;
    pointer-events: none;
  }

  /* ── Live offset (Numerical mode) ── */
  #live-offset {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    text-align: left;
    transform: translateY(-50%);
  }
  #live-num {
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #live-unit {
    font-size: 0.9rem;
    font-weight: 400;
    opacity: 0.55;
    margin-left: 2px;
  }
  #live-label {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.45;
    margin-top: 2px;
  }

  /* ── Instruction overlay ── */
  #instruction {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: rgba(60,60,120,0.4);
    pointer-events: none;
    text-align: center;
    line-height: 2;
    transition: opacity 0.3s;
  }

  /* ── Score popup ── */
  #score-popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #score-popup .grade {
    font-size: 5.5rem;
    font-weight: 800;
    line-height: 1;
    text-shadow: 0 2px 18px rgba(0,0,0,0.14);
  }
  #score-popup .grade-label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 600;
  }

  /* ── Bottom stats ── */
  #ui {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    width: 100%;
    max-width: 720px;
    justify-content: space-between;
  }

  .stat-box {
    background: #f7f7fd;
    border: 1.5px solid #e2e2f0;
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    flex: 1;
  }
  .stat-label {
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9090b8;
    margin-bottom: 3px;
  }
  .stat-value {
    font-size: 1.15rem;
    font-weight: 700;
    color: #5050a0;
  }
  .stat-value.good { color: #18a050; }
  .stat-value.bad  { color: #c83030; }
  .stat-value.meh  { color: #b07010; }

  #btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  #download-box {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #csv-filename {
    background: #f7f7fd;
    border: 1.5px solid #e2e2f0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.75rem;
    font-family: inherit;
    color: #5050a0;
    width: 140px;
  }
  #csv-filename::placeholder { color: #a0a0c8; }
  #csv-filename:focus { outline: none; border-color: #a0a0d8; }

  button.action-btn {
    background: #f3f3fa;
    border: 1.5px solid #d0d0e8;
    color: #5050a0;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  button.action-btn:hover { background: #e8e8f8; border-color: #a0a0d8; }
  button.action-btn:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<h1>Line Tracer</h1>
<div id="subtitle">Follow the curve as precisely as you can</div>

<div id="mode-row">
  <button class="mode-btn" data-mode="no-feedback">No Feedback</button>
  <button class="mode-btn active" data-mode="numerical">Numerical</button>
  <button class="mode-btn" data-mode="spatial-color">Spatial-Color</button>
</div>
<div id="mode-desc">Shows your pixel distance from the line in real time</div>

<div id="canvas-wrap">
  <canvas id="c" width="720" height="380"></canvas>
  <div id="mode-badge"></div>

  <!-- Numerical mode: live pixel readout -->
  <div id="live-offset">
    <div id="live-num">0</div>
    <span id="live-unit">px off</span>
    <div id="live-label">from line</div>
  </div>

  <div id="instruction">Click the <span style="color:#4a36c0;font-weight:700">● start point</span> to begin tracing</div>

  <div id="score-popup">
    <div class="grade" id="grade-letter">A</div>
    <div class="grade-label" id="grade-label">Excellent!</div>
  </div>
</div>

<div id="ui">
  <div class="stat-box">
    <div class="stat-label">Avg. Offset</div>
    <div class="stat-value" id="stat-avg">—</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Max Offset</div>
    <div class="stat-value" id="stat-max">—</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Area Off By</div>
    <div class="stat-value" id="stat-area">—</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="stat-score">—</div>
  </div>
  <div id="btn-row">
    <button class="action-btn" id="btn-reset">New Curve</button>
    <button class="action-btn" id="btn-show" disabled>Show Error</button>
    <div id="download-box">
      <input type="text" id="csv-filename" placeholder="Filename (e.g. trial_01)" maxlength="64">
      <button class="action-btn" id="btn-download" disabled>Download CSV</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── State ────────────────────────────────────────────────────────────────────
let state        = 'idle';   // idle | tracing | done
let targetCurve  = [];
let userPath     = [];
let showingError = false;
let mode         = 'numerical';
let trialNumber  = 0;

// Fixed "medium" difficulty curve params
const CURVE = { amp: 88, freq: 2.1, tolerance: 20 };

const MODE_META = {
  'no-feedback':   {
    badge: 'No Feedback',
    badgeBg: '#666', badgeColor: '#fff',
    desc: 'Trace the line — results revealed at the end only',
  },
  'numerical': {
    badge: 'Numerical',
    badgeBg: '#4a36c0', badgeColor: '#fff',
    desc: 'Shows your pixel distance from the line in real time',
  },
  'spatial-color': {
    badge: 'Spatial-Color',
    badgeBg: '#18a050', badgeColor: '#fff',
    desc: 'Background shifts green → red based on how close you are',
  },
};

// ── Curve generation ──────────────────────────────────────────────────────────
function generateCurve() {
  const pts = [], N = 400;
  const a1  = CURVE.amp * (0.75 + Math.random() * 0.5);
  const a2  = CURVE.amp * (0.28 + Math.random() * 0.38);
  const f1  = CURVE.freq * (0.82 + Math.random() * 0.36);
  const f2  = CURVE.freq * (1.5  + Math.random() * 0.6);
  const ph1 = Math.random() * Math.PI * 2;
  const ph2 = Math.random() * Math.PI * 2;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = 60 + t * (W - 120);
    const y = H / 2
      + a1 * Math.sin(f1 * Math.PI * 2 * t + ph1)
      + a2 * Math.sin(f2 * Math.PI * 2 * t + ph2);
    pts.push({ x, y: Math.max(42, Math.min(H - 42, y)) });
  }
  return pts;
}

function generateCurve2() {
  const pts = [], N = 400;
  const a1  = CURVE.amp * (0.75 +  2 * 0.5);
  const a2  = CURVE.amp * (0.28 + 1 * 0.38);
  const f1  = CURVE.freq * (0.82 + 3* 0.36);
  const f2  = CURVE.freq * (1.5  + 4 * 0.6);
  const ph1 = 1.2 * Math.PI * 2;
  const ph2 = 1.5 * Math.PI * 2;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = 60 + t * (W - 120);
    const y = H / 2
      + a1 * Math.sin(f1 * Math.PI * 2 * t + ph1)
      + a2 * Math.sin(f2 * Math.PI * 2 * t + ph2);
    pts.push({ x, y: Math.max(42, Math.min(H - 42, y)) });
  }
  return pts;
}

// ── Session start ─────────────────────────────────────────────────────────────
function startNew() {
  targetCurve  = generateCurve2();
  userPath     = [];
  state        = 'idle';
  showingError = false;
  resetBackground();
  el('instruction').style.opacity  = '1';
  el('score-popup').style.opacity  = '0';
  el('live-offset').style.opacity  = '0';
  el('btn-show').disabled          = true;
  el('btn-show').textContent       = 'Show Error';
  el('btn-download').disabled      = true;
  resetStats();
  applyModeUI();
  draw();
}

function el(id) { return document.getElementById(id); }

// ── Mode UI ───────────────────────────────────────────────────────────────────
function applyModeUI() {
  const m = MODE_META[mode];
  const badge = el('mode-badge');
  badge.textContent      = m.badge;
  badge.style.background = m.badgeBg;
  badge.style.color      = m.badgeColor;
  el('mode-desc').textContent = m.desc;
}

// ── Background (Spatial-Color) ────────────────────────────────────────────────
let lastBgOffset = -1;
const BG_UPDATE_THRESHOLD = 2.5;  // only update when offset changes by this much (reduces flashing)

function setBackground(offsetPx) {
  if (Math.abs(offsetPx - lastBgOffset) < BG_UPDATE_THRESHOLD) return;
  lastBgOffset = offsetPx;
  // Traffic-light: 0→2px = green, 2→5px = yellow, 5px+ = red (small shift = red)
  let r, g, b;
  if (offsetPx <= 2) {
    const s = offsetPx / 2;
    r = Math.round(lerp(255, 180, s));
    g = Math.round(lerp(255, 235, s));
    b = Math.round(lerp(255, 175, s));
  } else if (offsetPx <= 5) {
    const s = (offsetPx - 2) / 3;
    r = Math.round(lerp(180, 255, s));
    g = Math.round(lerp(235, 210, s));
    b = Math.round(lerp(175, 80,  s));
  } else {
    const s = Math.min((offsetPx - 5) / 10, 1);
    r = 255;
    g = Math.round(lerp(210, 65,  s));
    b = Math.round(lerp(80,  65,  s));
  }
  document.body.style.background = `rgb(${r},${g},${b})`;
}

function resetBackground() {
  document.body.style.background = '#ffffff';
  lastBgOffset = -1;
}

// ── Numerical live readout ────────────────────────────────────────────────────
function updateLiveOffset(d, x, y) {
  const elm = el('live-offset');
  elm.style.opacity = '1';
  elm.style.left = Math.min(Math.max(x + 22, 8), W - 110) + 'px';
  elm.style.top = Math.min(Math.max(y - 28, 12), H - 48) + 'px';
  el('live-num').textContent = d.toFixed(1);
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawCurve(pts, color, lw) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = color;
  ctx.lineWidth   = lw;
  ctx.lineJoin    = 'round';
  ctx.lineCap     = 'round';
  ctx.stroke();
}

function drawStartDot() {
  const p = targetCurve[0];
  ctx.beginPath();
  ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(74,54,192,0.32)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
  ctx.fillStyle   = '#4a36c0';
  ctx.fill();
}

function drawEndDot() {
  const p = targetCurve[targetCurve.length - 1];
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(74,54,192,0.38)';
  ctx.fill();
}

function drawErrorArea() {
  if (userPath.length < 2 || targetCurve.length < 2) return;
  const tc = targetCurve, up = userPath;
  const N = tc.length - 1, ulen = up.length - 1;
  ctx.beginPath();
  ctx.moveTo(tc[0].x, tc[0].y);
  for (let i = 1; i <= N; i++) ctx.lineTo(tc[i].x, tc[i].y);
  for (let i = N - 1; i >= 0; i--) {
    const ui = Math.min(Math.round((i / N) * ulen), ulen);
    ctx.lineTo(up[ui].x, up[ui].y);
  }
  ctx.closePath();
  ctx.fillStyle = 'hsla(118, 70%, 48%, 0.22)';
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // subtle grid
  ctx.strokeStyle = 'rgba(0,0,0,0.045)';
  ctx.lineWidth   = 1;
  for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (showingError) drawErrorArea();

  // target curve with soft glow
  ctx.shadowColor = 'rgba(74,54,192,0.2)';
  ctx.shadowBlur  = 10;
  drawCurve(targetCurve, '#4a36c0', 2.5);
  ctx.shadowBlur  = 0;

  // user trace
  if (userPath.length > 1) drawCurve(userPath, 'rgba(16,160,82,0.82)', 2.2);

  drawEndDot();
  if (state === 'idle') drawStartDot();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function dist(ax, ay, bx, by) {
  return Math.sqrt((ax - bx) ** 2 + (ay - by) ** 2);
}
function lerp(a, b, t) { return a + (b - a) * t; }

/** Perpendicular (vector normal) distance from point to line segment; returns { dist, foot } */
function pointToSegmentDistAndFoot(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const wx = px - ax, wy = py - ay;
  const c1 = wx * vx + wy * vy;
  const c2 = vx * vx + vy * vy;
  if (c2 < 1e-12) return { dist: dist(px, py, ax, ay), foot: { x: ax, y: ay } };
  let b = c1 / c2;
  if (b <= 0) return { dist: dist(px, py, ax, ay), foot: { x: ax, y: ay } };
  if (b >= 1) return { dist: dist(px, py, bx, by), foot: { x: bx, y: by } };
  const qx = ax + b * vx, qy = ay + b * vy;
  return { dist: dist(px, py, qx, qy), foot: { x: qx, y: qy } };
}

function pointToSegmentDist(px, py, ax, ay, bx, by) {
  return pointToSegmentDistAndFoot(px, py, ax, ay, bx, by).dist;
}

/** Perpendicular distance from point to polyline (min over all segments) */
function pointToPolylineDist(px, py, pts) {
  if (pts.length < 2) return pts.length === 1 ? dist(px, py, pts[0].x, pts[0].y) : Infinity;
  let best = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = pointToSegmentDist(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
    if (d < best) best = d;
  }
  return best;
}

/** Perpendicular distance and foot point on polyline */
function pointToPolylineDistAndFoot(px, py, pts) {
  if (pts.length < 2) {
    if (pts.length === 1) return { dist: dist(px, py, pts[0].x, pts[0].y), foot: { x: pts[0].x, y: pts[0].y } };
    return { dist: Infinity, foot: null };
  }
  let best = { dist: Infinity, foot: null };
  for (let i = 0; i < pts.length - 1; i++) {
    const r = pointToSegmentDistAndFoot(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
    if (r.dist < best.dist) best = r;
  }
  return best;
}

function nearestDist(px, py) {
  return pointToPolylineDist(px, py, targetCurve);
}

function computeOffsets() {
  if (userPath.length === 0) return [];
  return targetCurve.map((tp, i) => {
    const t  = i / (targetCurve.length - 1);
    const ui = Math.min(Math.round(t * (userPath.length - 1)), userPath.length - 1);
    const up = userPath[ui];
    const d  = pointToPolylineDist(up.x, up.y, targetCurve);
    return { tx: tp.x, ty: tp.y, ux: up.x, uy: up.y, dist: d };
  });
}

function segmentLength(ax, ay, bx, by) {
  return dist(ax, ay, bx, by);
}

function computeArea(offs) {
  return offs.reduce((sum, o, i) => {
    if (i === 0) return sum;
    const p = offs[i - 1];
    const segLen = segmentLength(p.tx, p.ty, o.tx, o.ty);
    return sum + ((o.dist + p.dist) / 2) * segLen;
  }, 0);
}

// ── Grade ─────────────────────────────────────────────────────────────────────
function getGrade(avg) {
  const r = avg / CURVE.tolerance;
  if (r) return { label: 'Done!',    color: '#18a050' };
}

// ── Finalize ──────────────────────────────────────────────────────────────────
function finalize() {
  state = 'done';
  resetBackground();
  el('live-offset').style.opacity = '0';

  const offs  = computeOffsets();
  if (!offs.length) return;

  const ds    = offs.map(o => o.dist);
  const avg   = ds.reduce((a, b) => a + b, 0) / ds.length;
  const max   = Math.max(...ds);
  const area  = computeArea(offs);
  const score = Math.max(0, Math.round(100 - avg * 2));
  const grade = getGrade(avg);
  const cls   = avg < CURVE.tolerance ? 'good' : avg < CURVE.tolerance * 2 ? 'meh' : 'bad';

  setStat('stat-avg',   avg.toFixed(1) + 'px', cls);
  setStat('stat-max',   max.toFixed(1) + 'px', cls);
  setStat('stat-area',  Math.round(area) + ' px²', cls);
  setStat('stat-score', score + '%', cls);

  el('grade-letter').textContent = grade.letter;
  el('grade-letter').style.color = grade.color;
  el('grade-label').textContent  = grade.label;
  el('grade-label').style.color  = grade.color;
  el('score-popup').style.opacity   = '1';
  el('btn-show').disabled           = false;
  el('btn-download').disabled       = false;
  trialNumber += 1;
  el('instruction').style.opacity   = '0';
  draw();
}

function setStat(id, val, cls) {
  const e = el(id);
  e.textContent = val;
  e.className   = 'stat-value ' + (cls || '');
}

function resetStats() {
  ['stat-avg','stat-max','stat-area','stat-score'].forEach(id => {
    el(id).textContent = '—';
    el(id).className   = 'stat-value';
  });
}

// ── CSV download ───────────────────────────────────────────────────────────────
function downloadTrialCSV() {
  if (state !== 'done' || !targetCurve.length || !userPath.length) return;
  const offs = computeOffsets();
  const ts = new Date().toISOString();
  const lines = [];

  lines.push('trial,' + trialNumber);
  lines.push('timestamp,' + ts);
  lines.push('mode,' + mode);
  lines.push('');

  lines.push('target_curve');
  lines.push('index,target_x,target_y');
  targetCurve.forEach((p, i) => lines.push(`${i},${p.x.toFixed(2)},${p.y.toFixed(2)}`));
  lines.push('');

  lines.push('user_path');
  lines.push('index,user_x,user_y');
  userPath.forEach((p, i) => lines.push(`${i},${p.x.toFixed(2)},${p.y.toFixed(2)}`));
  lines.push('');

  lines.push('matched_data');
  lines.push('index,target_x,target_y,user_x,user_y,offset_px');
  offs.forEach((o, i) => lines.push(`${i},${o.tx.toFixed(2)},${o.ty.toFixed(2)},${o.ux.toFixed(2)},${o.uy.toFixed(2)},${o.dist.toFixed(2)}`));

  const customName = (el('csv-filename').value || '').trim().replace(/[/\\:*?"<>|]/g, '_');
  const baseName = customName || `line_tracer_trial_${trialNumber}_${ts.slice(0, 19).replace(/[:-]/g, '')}`;
  const fileName = baseName.endsWith('.csv') ? baseName : baseName + '.csv';

  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('mousedown', e => {
  if (state === 'done') return;
  const pos = getPos(e);
  if (state === 'idle' && dist(pos.x, pos.y, targetCurve[0].x, targetCurve[0].y) < 22) {
    state    = 'tracing';
    userPath = [pos];
    el('instruction').style.opacity = '0';
  }
});

canvas.addEventListener('mousemove', e => {
  if (state !== 'tracing') return;
  const pos = getPos(e);
  userPath.push(pos);
  const d = nearestDist(pos.x, pos.y);

  if (mode === 'numerical')     updateLiveOffset(d, pos.x, pos.y);
  if (mode === 'spatial-color') setBackground(d);

  const end = targetCurve[targetCurve.length - 1];
  if (dist(pos.x, pos.y, end.x, end.y) < 20) {
    finalize();
  } else {
    draw();
  }
});

canvas.addEventListener('mouseup', () => {
  if (state === 'tracing' && userPath.length > 8) finalize();
});

// ── Controls ──────────────────────────────────────────────────────────────────
el('btn-reset').addEventListener('click', startNew);

el('btn-show').addEventListener('click', () => {
  showingError = !showingError;
  el('btn-show').textContent = showingError ? 'Hide Error' : 'Show Error';
  draw();
});

el('btn-download').addEventListener('click', downloadTrialCSV);

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    startNew();
  });
});

// ── Boot ──────────────────────────────────────────────────────────────────────
startNew();
</script>
</body>
